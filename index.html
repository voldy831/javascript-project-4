<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="score-container">
        <div>Current Round: <span id="current-round">1</span></div>
        <div>Best Score: <span id="best-score">0</span></div>
    </div>

    <div class="game-board">
        <div class="card-red" id="0"></div>
        <div class="card-blue" id="1"></div>
        <div class="card-green" id="2"></div>
        <div class="card-yellow" id="3"></div>
    </div>

    <div class="status-box">
        PRESS START
    </div>

    <button id="start-btn">START</button>
    <script src="main.js"></script>
</body>
</html>
